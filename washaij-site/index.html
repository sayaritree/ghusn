<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>وشائج 18 | أطلس السياري</title><style>
:root{color-scheme:light;font-family:Tahoma,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}

#panoramaStage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#f5f4ef}

@media(max-width:650px){
 #panoramaNav{padding:7px 6px;gap:6px;min-height:51px;flex-wrap:nowrap}
 #panoramaNav button{font-size:11px;line-height:1.45;padding:8px 8px;min-height:38px;flex:1;max-width:220px}
}
