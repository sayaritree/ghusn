html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f6f1}
#ghusn-app{width:100%;height:100%;display:block;border:0;background:#f4f6f1}
#load-hint{position:fixed;inset:0;display:grid;place-items:center;background:#f4f6f1;color:#164937;font:700 18px Tahoma,Arial;pointer-events:none}

</style></head>
<body><div id="load-hint">وَشَائِج — جارٍ فتح شجرة العلاقات الأسرية…</div>
<iframe id="ghusn-app" src="/washaij-core.html" title="وَشَائِج — العلاقات الأسرية" allow="fullscreen"></iframe>
<script>
(function(){
 const frame=document.getElementById('ghusn-app');
 function ready(){document.getElementById('load-hint').hidden=true}
 frame.addEventListener('load',ready);
 if(frame.contentDocument?.readyState==='complete')ready();
})();
</script>
