stage.addEventListener('pointerdown',e=>{if(!document.body.classList.contains('ghosn-enhanced'))return;const n=e.target.closest?.('.graph-node');if(!n||n.classList.contains('muted'))return;if(!n.classList.contains('ghosn-bloodline')&&!n.classList.contains('ghosn-spouse')&&!n.classList.contains('ghosn-blood-branch'))return;n.classList.remove('ghosn-cinema-hit');void n.getBoundingClientRect();n.classList.add('ghosn-cinema-hit');const fx=n.querySelector('.ghosn-fx-layer'),r=fx?.querySelector('.node-body');if(fx&&r){const w=Number(r.getAttribute('width')),h=Number(r.getAttribute('height'));const wave=make('rect',{x:-5,y:-5,width:w+10,height:h+10,rx:Number(r.getAttribute('rx'))+5,'class':'ghosn-cinema-wave'});fx.append(wave);wave.addEventListener('animationend',()=>wave.remove(),{once:true});setTimeout(()=>wave.remove(),1000);}setTimeout(()=>n.classList.remove('ghosn-cinema-hit'),850);},true);
if(document.body.classList.contains('ghosn-enhanced'))sync();
})();

</script>

<script id="washaijFontZoomLogic">
(()=>{
  'use strict';
  const svg=document.getElementById('treeSvg');
  const level=document.getElementById('wsFontLevel');
  const plus=document.getElementById('wsFontPlus');
  const minus=document.getElementById('wsFontMinus');
  const reset=document.getElementById('wsFontReset');
  const key='washaij_text_scale_v1';
  const min=70,max=150,step=10;
  let value=100,pending=false;
  try {const saved=Number(localStorage.getItem(key));if(Number.isFinite(saved)&&saved>=min&&saved<=max&&saved%10===0)value=saved;}catch(_){}
  // The drawing's BOX dimensions, every SVG rect, connector and viewBox are never changed.
  const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');
  const originalCards=new WeakMap();
  const segmenter=typeof Intl.Segmenter==='function'?new Intl.Segmenter('ar',{granularity:'grapheme'}):null;
  const chars=s=>segmenter?Array.from(segmenter.segment(s),x=>x.segment):Array.from(s);
  const measure=(s,size,weight,family)=>{
    ctx.font=weight+' '+size+'px '+family;
    return ctx.measureText(s).width;
  };
  const initialSize=(t)=>{
    let n=Number(t.getAttribute('data-ws-base-font'));
    if(!Number.isFinite(n)||n<=0){n=Number.parseFloat(getComputedStyle(t).fontSize);t.setAttribute('data-ws-base-font',String(n));}
    return n;
  };
  // A word boundary is preferred. A single long Arabic word can also break at a grapheme.
  function splitIntoTwo(original,font,available,weight,family){
    const full=original.trim().replace(/\s+/g,' ');
    if(measure(full,font,weight,family)<=available)return [full];
    const cs=chars(full),offsets=[];let total=0;
    for(let i=0;i<cs.length-1;i++){total+=cs[i].length;offsets.push(total);}
    let best=null;
    const consider=(onlySpaces)=>{
      for(const i of offsets){
        const a=full.slice(0,i).trim(),b=full.slice(i).trim();
        if(!a||!b)continue;
        const isBoundary=/\s/.test(full[i-1]||'')||/\s/.test(full[i]||'');
        if(onlySpaces&&!isBoundary)continue;
        const wa=measure(a,font,weight,family),wb=measure(b,font,weight,family);
        if(wa>available||wb>available)continue;
        const score=Math.abs(wa-wb)+(!isBoundary?available*.23:0);
        if(best===null||score<best.score)best={lines:[a,b],score};
      }
    };
    consider(true);if(!best)consider(false);
    return best?.lines||null;
  }
  // At a given card's fixed dimensions, favor the user's requested size, and reduce
  // only for exceptional names that cannot fit completely in two lines.
  function layout(original,desired,available,maxHeight,weight,family){
    let best=null;
    for(let size=desired;size>=8.2;size-=.25){
      const lines=splitIntoTwo(original,size,available,weight,family);
      if(!lines)continue;
      const lineHeight=size*1.19;
      if(lineHeight*lines.length>maxHeight+.15)continue;
      best={lines,size,lineHeight};break;
    }
    return best||{lines:[original],size:8,lineHeight:9.5};
  }
  function reflowNames(card){
    const rect=card.querySelector('.node-body');if(!rect)return;
    const width=Number(rect.getAttribute('width')),height=Number(rect.getAttribute('height'));
    const child=card.classList.contains('tier-child');
    const names=Array.from(card.querySelectorAll(child?'.child-name':'.node-name'));
    if(!names.length)return;
    const first=names[0];
    const dates=Array.from(card.querySelectorAll('.life-line'));
    if(!originalCards.has(card))originalCards.set(card,{
      text:child?first.textContent:(card.getAttribute('data-full-name')||names.map(t=>t.textContent).join(' ')),
      size:initialSize(first),
      family:getComputedStyle(first).fontFamily||'Tahoma,Arial,sans-serif',
      weight:getComputedStyle(first).fontWeight||'700',
      originalNodes:names.map(n=>n.cloneNode(true)),
      originalDates:dates.map(t=>t.getAttribute('y'))
    });
    const saved=originalCards.get(card);
    // Reset restores the approved original one/two/three-line drawing exactly.
    if(value===100){
      if(card.dataset.wsWrappedActive){
        first.replaceWith(...saved.originalNodes.map(n=>n.cloneNode(true)));
        dates.forEach((t,i)=>t.setAttribute('y',saved.originalDates[i]));
        delete card.dataset.wsWrappedActive;
      }
      return;
    }
    for(const extra of names.slice(1))extra.remove();
    // Reserving a band for dates and "other relationship" keeps all content in the card.
    let top,bottom;
    if(child){
      top=7;
      if(dates.length){
        const firstDate=dates.length===1?height-8:height-15;
        dates.forEach((el,i)=>{el.setAttribute('y',String(firstDate+i*10.5));});
        bottom=firstDate-11;
      }else bottom=height-5;
    }else{
      top=26;
      if(dates.length){
        bottom=Math.min(...dates.map(t=>Number(t.getAttribute('y'))))-9;
      }else if(card.querySelector('.node-role'))bottom=height-24;
      else bottom=height-10;
    }
    bottom=Math.max(top+10,bottom);
    const roomWidth=width-(child?12:22);
    const desired=saved.size*value/100;
    const result=layout(saved.text,desired,roomWidth,bottom-top,saved.weight,saved.family);
    first.style.fontSize=result.size.toFixed(2)+'px';
    first.removeAttribute('textLength');first.removeAttribute('lengthAdjust');
    first.replaceChildren();
    first.setAttribute('x',String(width/2));
    first.setAttribute('text-anchor','middle');
    first.setAttribute('direction','rtl');
    const n=result.lines.length;
    // SVG text uses a baseline rather than top-left. Vertical centering remains card-local.
    const totalLineHeight=result.lineHeight*n;
    const firstBaseline=top+(bottom-top-totalLineHeight)/2+result.size*.96;
    result.lines.forEach((line,i)=>{
      const span=document.createElementNS('http://www.w3.org/2000/svg','tspan');
      span.setAttribute('x',String(width/2));
      span.setAttribute('y',(firstBaseline+i*result.lineHeight).toFixed(2));
      span.textContent=line;
      first.appendChild(span);
    });
    card.dataset.wsWrappedLines=String(n);
    card.dataset.wsWrappedActive='1';
    card.dataset.wsActualFont=result.size.toFixed(2);
    // Full names remain accessible to touch / screen readers even when squeezed by space.
    if(!card.hasAttribute('title'))card.setAttribute('title',card.getAttribute('data-full-name')||saved.text);
  }
  function updateText(){
    pending=false;
    // Size ancillary labels first; they never change the card geometry.
    svg.querySelectorAll('.graph-node .life-line,.graph-node .node-role,.alt-edge-text,.canvas-label').forEach(t=>{
      const base=initialSize(t);
      const ratio=t.classList.contains('life-line')?1+(value/100-1)*.45:value/100;
      t.style.fontSize=(base*ratio).toFixed(2)+'px';
      t.removeAttribute('textLength');t.removeAttribute('lengthAdjust');
      const rect=t.closest('.graph-node')?.querySelector('.node-body');if(!rect)return;
      const available=Number(rect.getAttribute('width'))-10;
      try{if(t.getComputedTextLength()>available){t.setAttribute('textLength',String(available));t.setAttribute('lengthAdjust','spacingAndGlyphs');}}catch(_){}
    });
    svg.querySelectorAll('.graph-node').forEach(reflowNames);
  }
  function schedule(){if(pending)return;pending=true;requestAnimationFrame(updateText);}
  function sync(save){
    level.textContent=value+'%';plus.disabled=value>=max;minus.disabled=value<=min;reset.disabled=value===100;
    if(save){try{localStorage.setItem(key,String(value));}catch(_){}}
    schedule();
  }
  plus.addEventListener('click',()=>{value=Math.min(max,value+step);sync(true);});
  minus.addEventListener('click',()=>{value=Math.max(min,value-step);sync(true);});
  reset.addEventListener('click',()=>{value=100;sync(true);});
  new MutationObserver(records=>{
    if(records.some(record=>record.type==='childList'&&!(record.target.closest?.('.graph-node'))))schedule();
  }).observe(svg,{childList:true,subtree:true});
  sync(false);
})();
</script>
