<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<title>وشائج | مشجر عبدالعزيز السياري — تحديث بيانات V8</title>
<style>
:root{--ink:#254439;--green:#527d6b;--soft:#e8f0e9;--gold:#ac8751;--gray:#aab0a9;--rose:#78536f;--paper:#fffefb}
*{box-sizing:border-box}
html,body{width:100%;max-width:100%;overflow-x:clip;margin:0}
body{background:#f5f4ef;color:var(--ink);font-family:"Noto Sans Arabic Condensed","Noto Sans Arabic",Tahoma,Arial,sans-serif}
header{max-width:1610px;margin:auto;padding:16px 24px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:21px;font-weight:900;margin:0}
.sub{font-size:12px;color:#728076}
.toolbar{display:flex;align-items:center;gap:7px}
.toolbar button, .dialog-close {font:800 14px "Noto Sans Arabic",Tahoma,sans-serif;border:1px solid #d7dfd2;border-radius:6px;background:#fff;padding:5px 11px;cursor:pointer;color:#395e51}
.layout{max-width:1770px;margin:0 auto;padding:0 12px 20px}
.sheet{background:var(--paper);border:1px solid #e2e5d9;box-shadow:0 10px 40px #3d554213;border-radius:6px;position:relative;overflow:auto}
#picture{display:block;width:100%;height:auto;touch-action:pan-y pinch-zoom;user-select:none}
.sheet svg .blood{stroke:#6f9c90;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.sheet svg .wed{stroke:var(--gold);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.sheet svg .other{stroke:var(--gray);stroke-width:1.75;stroke-dasharray:5 6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.sheet svg .refwire{stroke:#b2b7ae;stroke-width:1.3;fill:none;stroke-linecap:round}
.sheet svg text{font-family:"Noto Sans Arabic Condensed","Noto Sans Arabic",Tahoma,Arial,sans-serif;text-anchor:middle;dominant-baseline:middle}
.sheet svg .father{font-weight:900;fill:#254e40}
.sheet svg .daughter{font-weight:900;fill:#79546b}
.sheet svg .spouse{font-weight:800;fill:#414e48}
.sheet svg .othername{font-weight:750;fill:#78827b}
.sheet svg .smallname{font-size:18px}
.sheet svg .caption{font-size:13px;fill:#8b918a;font-weight:650}
.sheet svg .count{font-size:16px;fill:#657b72;font-weight:850}
.sheet svg .titlebig{font-size:32px}
.sheet svg .topname{font-size:22px}
.sheet svg .child{font-size:24px}
.sheet svg .dot{fill:#b6a27b}
.sheet svg .target{cursor:pointer;outline:none}
.sheet svg .target:hover text,.sheet svg .target:focus text{text-decoration:underline}
.sheet svg .target:hover .dot{fill:#a17732}
footer{max-width:1770px;margin:0 auto;padding:10px 18px 25px;color:#66756b;font-size:12px;display:flex;justify-content:space-between;gap:15px}
dialog{width:min(470px,94vw);max-height:80dvh;background:#fffefa;border:1px solid #d4ded5;border-radius:12px;color:#203f35;padding:0;box-shadow:0 20px 100px #1a302b4d}
dialog::backdrop{background:#102b2566}
.dialog-head{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-bottom:1px solid #e4e7df;gap:12px}
.dialog-head h2{font-size:17px;margin:0}
.dialog-body{padding:12px 18px;line-height:2;font-size:13px;overflow:auto;max-height:67dvh}
.dialog-body div{padding:4px 0;border-bottom:1px solid #edf0e9}
.dialog-close{font-size:23px;border:none}
.mobile-hint{display:none}
@media(max-width:1150px){header{padding:9px 12px;align-items:start}h1{font-size:16px}.sub{font-size:11px}.layout{padding:0 4px 8px}.sheet{border-radius:0}footer{font-size:10px;padding:9px}.mobile-hint{display:inline}.toolbar button{padding:3px 7px}}
@media print{body{background:white}header,.toolbar,footer{display:none!important}.layout{padding:0}.sheet{border:none;box-shadow:none}}
.reference-notes{border-top:1px solid #e3e7df;margin:0 36px 20px;padding:15px 8px 2px;display:grid;gap:8px;direction:rtl;text-align:right}
.reference-notes .notes-title{font-size:13px;color:#4f7564;font-weight:900;margin:0 0 1px}
.reference-notes p{font-size:12.5px;line-height:1.9;margin:0;color:#4b5c52}
.refkey{display:inline-flex;align-items:center;justify-content:center;min-width:21px;height:21px;border:1px solid #b8a37d;border-radius:50%;margin-inline:1px 4px;color:#836633;background:#fffefa;font:800 11px Tahoma,Arial,sans-serif;vertical-align:middle;direction:ltr}
.sheet svg .refpin{fill:#fffefb;stroke:#b39b6a;stroke-width:1.2}
.sheet svg .refnum{font-size:11px;font-family:Tahoma,Arial,sans-serif;font-weight:900;fill:#856330;text-anchor:middle;dominant-baseline:middle}
@media(max-width:1150px){.reference-notes{margin:0 10px 14px;padding:12px 2px 0;gap:10px}.reference-notes p{font-size:12px}.refkey{min-width:19px;height:19px;font-size:10px}}
</style>
</head>

<script>
"use strict";
const D=JSON.parse(document.querySelector('#data').textContent);
const people=new Map(D.people.map(p=>[String(p.id),p]));
const S=document.querySelector("#picture"),NS="http://www.w3.org/2000/svg";
const $= (tag,attrs={},parent=S)=>{
 const el=document.createElementNS(NS,tag);
 Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,String(v)));
 parent.appendChild(el);return el;
};
const person=id=>people.get(String(id));
const shown=(id,kind="adult")=>{
 const p=person(id);if(!p) return "";
 return (kind==="child" ? p.first : p.display) || p.name || "";
};
const full=id=>person(id)?.name || "";
const hasId=(n,id)=>String(n||"")===String(id);
const children=(father,mother=null)=>D.people.filter(p=>
 ((hasId(p.father,father)&&(!mother||hasId(p.mother,mother)))||
  (mother&&hasId(p.father,mother)&&hasId(p.mother,father)))
);
const cnt=(id)=>person(id)?.approvedCount || D.people.filter(p=>hasId(p.father,id)||hasId(p.mother,id)).length;
const arab=n=>String(n).replace(/[0-9]/g,x=>"٠١٢٣٤٥٦٧٨٩"[Number(x)]);
const countLabel=(a,b)=>{
 const list=children(a,b);
 if(list.length===1) return list[0].sex==="بنت"?"ابنة واحدة":"ابن واحد";
 return arab(list.length)+" أبناء";
};
const status=(a,b)=>D.marriages.find(m=>
 (hasId(m.a,a)&&hasId(m.b,b))||(hasId(m.a,b)&&hasId(m.b,a))
)?.status || "";
const refOrder=["68","81","79","80","44"];
const numbered=refOrder.filter(id=>person(id)?.note);
const refNums=new Map(numbered.map((id,i)=>[id,i+1]));
const noteNum=id=>refNums.get(String(id)) || null;
function populateNotes(){
 const el=document.getElementById("reference-note-items");
 el.replaceChildren();
 const groups=new Map();
 for(const id of numbered){
  const n=person(id).note.trim();
  if(!groups.has(n))groups.set(n,[]);
  groups.get(n).push(noteNum(id));
 }
 for(const [comment,nums] of groups.entries()){
  const p=document.createElement("p");
  nums.forEach(n=>{
   const span=document.createElement("span");
   span.className="refkey";span.textContent=String(n);p.append(span);
  });
  p.append(document.createTextNode(" "+comment));
  el.append(p);
 }
}
let isMobile=innerWidth<1150, zoom=1;
function path(d,cls){return $("path",{d,class:cls});}
function label(x,y,words,opts={}){
 const {id=null,role="spouse",size=20,max=0,fill=null,lines=null,anchor="middle",refNo=null,refSide="right",refDx=0,refDy=0}=opts;
 let gp=$("g",{class:id?"target":""});
 if(id){gp.setAttribute("data-person",id);gp.setAttribute("tabindex","0");gp.setAttribute("role","button");gp.setAttribute("aria-label",people.get(String(id))?.name||words);}
 const arr=lines||[words];
 const txt=$("text",{x,y,class:role,"font-size":size,"text-anchor":anchor, ...(fill?{fill}:{})},gp);
 if(arr.length===1)txt.textContent=arr[0];
 else arr.forEach((line,i)=>{const t=$("tspan",{x,dy:i===0?-(arr.length-1)*12:25},txt);t.textContent=line;});
 if(id){ $("circle",{cx:x-((size===17)?37:Math.min(40,words.length*2.2))-6,cy:y-3,r:2.2,class:"dot"},gp);}
 if(refNo){
  let left=x, right=x;
  try {let bb=txt.getBBox();left=bb.x;right=bb.x+bb.width;} catch(e){let width=(arr.join("").length||words.length||1)*size*.5;left=x-width/2;right=x+width/2;}
  let bx=(refSide==="left"?left-10:right+10)+refDx;
  let by=(y-(arr.length>1?29:22))+refDy;
  bx=Math.min(isMobile?388:1725,Math.max(15,bx));
  $("circle",{cx:bx,cy:by,r:9.5,class:"refpin"},gp);
  const rt=$("text",{x:bx,y:by,class:"refnum"},gp);rt.textContent=String(refNo);
 }
 return gp;
}
function count(x,y,n){
 label(x,y,`${n}`,{role:"count",size:isMobile?15:16});
}
function endmark(x,y){$("circle",{cx:x,cy:y,r:2.5,fill:"#7d9f92"});}

function render(){
 S.replaceChildren();
 isMobile=innerWidth<1150;
 if(isMobile) mobile(); else desktop();
}
function escapeHtml(s){return String(s||"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const dialog=document.querySelector("#personDialog");
function show(id){
 let p=people.get(String(id));if(!p)return;
 const spouses=D.marriages.filter(m=>m.a==id||m.b==id).map(m=>person(m.a==id?m.b:m.a)?.name||m.legacyName).filter(Boolean);
 const descendants=D.people.filter(k=>hasId(k.father,id)||hasId(k.mother,id));
 document.querySelector("#personTitle").textContent=p.name;
 const r=[];
 r.push(`<div><b>الاسم الكامل:</b> ${escapeHtml(p.name)}</div>`);
 if(p.father)r.push(`<div><b>الأب:</b> ${escapeHtml(person(p.father)?.name || p.fatherText || "غير مسجل")}</div>`);
 if(p.mother)r.push(`<div><b>الأم:</b> ${escapeHtml(person(p.mother)?.name || p.motherText || "غير مسجلة")}</div>`);
 if(spouses.length)r.push(`<div><b>الأزواج المسجلون:</b> ${spouses.map(escapeHtml).join("، ")}</div>`);
 if(descendants.length)r.push(`<div><b>الأبناء المسجلون (${descendants.length}):</b> ${descendants.map(k=>escapeHtml(k.name)).join("، ")}</div>`);
 if(p.note)r.push(`<div><b>الحاشية:</b> ${escapeHtml(p.note)}</div>`);
 document.querySelector("#personBody").innerHTML=r.join("");
 dialog.showModal();
}
S.addEventListener("click",e=>{const gp=e.target.closest("[data-person]");if(gp)show(gp.dataset.person)});
S.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.dataset.person){e.preventDefault();show(e.target.dataset.person)}});
document.querySelector("#dialogClose").addEventListener("click",()=>dialog.close());
dialog.addEventListener("click",e=>{if(e.target===dialog)dialog.close()});
let resizing=0;
window.addEventListener("resize",()=>{if((innerWidth<1150)!==isMobile)render()});
const baseSmall=400,baseWide=1740;
function scaleVisual(f){
 zoom=Math.max(.85,Math.min(1.8,f));
 // Magnify picture and let the browser zoom gesture handle viewing the enlarged region.
 S.style.fontSize="";
 S.style.transformOrigin="top center";
 S.style.transform=`scale(${zoom})`;
 S.parentNode.style.paddingBottom=`${Math.max(0,Math.round((zoom-1)*(isMobile?S.clientHeight:Math.min(S.clientHeight,600))))}px`;
 document.querySelector("#fit").textContent=`${Math.round(zoom*100)}%`;
}
document.querySelector("#zoomIn").onclick=()=>scaleVisual(zoom+.15);
document.querySelector("#zoomOut").onclick=()=>scaleVisual(zoom-.15);
document.querySelector("#fit").onclick=()=>scaleVisual(1);
populateNotes();
render();
</script>
