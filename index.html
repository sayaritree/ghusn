const GHUSN_FONT_ZOOM_CSS="\n/* Independent Ghusn name zoom: geometry/positions/relationship drawings remain untouched. */\n.ghusn-font-dock{position:absolute;z-index:13;top:14px;left:65px;display:flex;flex-direction:column;align-items:center;width:47px;border:1px solid #cdb48c;border-radius:13px;background:#fff9edf2;box-shadow:0 3px 18px #604b3429;overflow:hidden;direction:rtl;user-select:none}\n.tool-dock .ghusn-drawing-title{display:block;width:100%;text-align:center;padding:5px 1px;font-size:11px;color:#705535;font-weight:900;border-bottom:1px solid #e1d5bb}\n.ghusn-font-dock .ghusn-font-title{font-weight:900;font-size:11px;color:#705535;width:100%;text-align:center;padding:5px 1px;border-bottom:1px solid #e1d5bb}\n.ghusn-font-dock button{display:grid;place-items:center;width:100%;height:39px;border:0;border-bottom:1px solid #e1d5bb;font-weight:900;font-size:17px;color:#366448;background:transparent;cursor:pointer;line-height:1}\n.ghusn-font-dock button:hover{background:#e9efe2}.ghusn-font-dock button:disabled{opacity:.3;cursor:default}\n.ghusn-font-dock .ghusn-font-percentage{font-size:10px;color:#6b654a;text-align:center;padding:6px 0;font-weight:800;font-variant-numeric:tabular-nums}\n.ghusn-font-dock .ghusn-font-restore{font-size:11px;height:32px;border-bottom:1px solid #e1d5bb}\n.ghusn-font-dock button:focus-visible{outline:2px solid #398766;outline-offset:-2px}\n.node.ghusn-text-zoomed{overflow:hidden;box-sizing:border-box;padding:3px 6px!important}\n.node.ghusn-text-zoomed .name{display:block;max-width:100%;min-width:0;white-space:normal;overflow-wrap:break-word;word-break:normal;line-height:1.08;flex-shrink:1}\n.node.ghusn-text-zoomed .subtext{flex-shrink:0;margin-top:3px}\n@media(max-width:570px){.ghusn-font-dock{top:65px;left:53px;width:39px}.ghusn-font-dock button{height:36px;font-size:15px}.tool-dock .ghusn-drawing-title{display:block;width:100%;text-align:center;padding:5px 1px;font-size:11px;color:#705535;font-weight:900;border-bottom:1px solid #e1 const GHUSN_FONT_ZOOM_JS="\n(()=>{'use strict';\n const scene=document.getElementById('scene');\n const dock=document.querySelector('.tool-dock');\n if(!scene||!dock||document.getElementById('ghusnFontDock'))return;\n dock.setAttribute('aria-label','تكبير وتصغير الرسم');\n const drawTitle=document.createElement('span');drawTitle.className='ghusn-drawing-title';drawTitle.textContent='الرسم';dock.prepend(drawTitle);\n const tools=document.createElement('section');\n tools.id='ghusnFontDock';tools.className='ghusn-font-dock';tools.setAttribute('aria-label','تكبير وتصغير الخط داخل بطاقات الأسماء');\n tools.innerHTML='<span class=\"ghusn-font-title\">الخط</span><button type=\"button\" id=\"ghusnFontPlus\" title=\"تكبير الخط\" aria-label=\"تكبير الخط\">A+</button><button type=\"button\" id=\"ghusnFontMinus\" title=\"تصغير الخط\" aria-label=\"تصغير الخط\">A−</button><button type=\"button\" class=\"ghusn-font-restore\" id=\"ghusnFontReset\" title=\"إعادة الخط إلى 100%\" aria-label=\"إعادة الخط إلى الحجم الأصلي\">↺</button><output id=\"ghusnFontLevel\" class=\"ghusn-font-percentage\" aria-live=\"polite\">100%</output>';\n dock.after(tools);\n const plus=tools.querySelector('#ghusnFontPlus'),minus=tools.querySelector('#ghusnFontMinus'),reset=tools.querySelector('#ghusnFontReset'),output=tools.querySelector('#ghusnFontLevel');\n const KEY='ghusn-name-font-scale-v1',MIN=70,MAX=150,STEP=10;\n let value=100;\n try{const stored=Number(localStorage.getItem(KEY));if(stored>=MIN&&stored<=MAX&&stored%STEP===0)value=stored;}catch(e){}\n let raf=0;\n const bases=new WeakMap();\n function setNatural(node){\n   const name=node.querySelector('.name');if(!name)return null;\n   if(!bases.has(node)){\n      const st=getComputedStyle(node);\n      // offsetHeight is the original natural height, unscaled by scene pan/zoom.\n      bases.set(node,{height:node.offsetHeight,baseFont:parseFloat(getComputedStyle(name).fontSize)||17,border:parseFloat(st.borderTopWidth)+parseFloat(st.borderBottomWidth)
