const $=id=>document.getElementById(id);
function bytes(s){const binary=atob(s);return Uint8Array.from(binary,c=>c.charCodeAt(0))}
let busy=false;
$('login-form').addEventListener('submit',async event=>{
    event.preventDefault();if(busy)return;
    $('error').textContent='';
    const name=$('username').value.trim().toUpperCase();
    const pass=$('password').value;
    const pack=dataTable[name];
    if(!pack){$('error').textContent='اسم المستخدم أو كلمة المرور غير صحيحة';return}
    if(!globalThis.crypto?.subtle){$('error').textContent='المتصفح لا يدعم فتح هذه النسخة. افتح الملف في متصفح حديث.';return}
    busy=true;$('enter').disabled=true;$('enter').textContent='جارٍ التحقق...';
    try{
       const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
       const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(pack.salt),iterations:310000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
       const decrypted=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(pack.nonce),additionalData:new TextEncoder().encode('treesayari:'+name)},key,bytes(pack.body));
       const html=new TextDecoder().decode(decrypted);
       $('site-frame').srcdoc=html;
       $('login-screen').hidden=true;
       $('login-screen').style.display='none';
       $('site-screen').style.display='block';
       $('password').value='';
    }catch(_){$('error').textContent='اسم المستخدم أو كلمة المرور غير صحيحة';$('password').value='';$('password').focus()}
    finally{busy=false;$('enter').disabled=false;$('enter').textContent='دخول'}
});
$('logout').addEventListener('click',()=>{
  $('site-frame').srcdoc='';$('site-frame').removeAttribute('srcdoc');$('site-screen').style.display='none';
  $('login-screen').style.display='flex';$('username').value='';$('password').value='';$('error').textContent='';$('username').focus();
});
</script>
