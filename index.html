<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5faf6">
<title>مشجر | تسجيل الدخول</title>
<style>
:root{font-family:"Tajawal","Noto Sans Arabic",Tahoma,Arial,sans-serif;color:#234d3a;background:#f7fbf6}
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 90% 2%,#e4f7ee 0%,transparent 47%),radial-gradient(ellipse at 10% 90%,#fff1df 0%,transparent 47%),#fbfef9;direction:rtl}
button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #7db99b;outline-offset:3px}
#login-screen{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:22px 15px}
.login-card{width:min(100%,420px);background:rgba(255,255,252,.95);border:1px solid #e3eede;border-radius:28px;box-shadow:0 22px 70px #34644b16;padding:29px 28px 31px}
.logo{display:flex;align-items:center;justify-content:center;gap:10px;color:#2b6146;font-weight:900;font-size:28px}
.logo svg{height:53px;width:53px}.subtitle{margin:7px 0 22px;text-align:center;font-size:14px;color:#889d8d;line-height:1.8}
label{display:block;font-size:14px;font-weight:800;margin:16px 0 7px}input{height:53px;width:100%;padding:0 16px;border-radius:13px;border:1px solid #dbe8dd;background:#fbfdfa;color:#28553c;font-size:16px;direction:ltr;text-align:left;letter-spacing:.5px}
input:focus{border-color:#78bb96;box-shadow:0 0 0 4px #a5dcc024;outline:0}input::placeholder{color:#adb8ac;letter-spacing:0}
#enter{width:100%;border:0;border-radius:13px;color:#fff;background:#2d7350;font-weight:900;font-size:17px;height:53px;margin-top:25px;box-shadow:0 7px 18px #2d73502a;transition:filter .2s}#enter:hover{filter:brightness(1.09)}#enter:disabled{cursor:wait;opacity:.75}
#error{min-height:24px;text-align:center;margin:10px 0 0;color:#b33c44;font-weight:700;font-size:13px}
#unsupported{min-height:16px;text-align:center;color:#8a9386;font-size:12px;margin:0}
#site-screen{display:none;position:fixed;inset:0;background:#fff}#site-frame{border:0;width:100%;height:100%;display:block}
#logout{position:fixed;left:12px;bottom:14px;z-index:10;background:rgba(255,255,252,.96);border:1px solid #c6dcca;color:#315a43;box-shadow:0 3px 12px #26473722;font-weight:800;border-radius:12px;padding:9px 14px;font-size:12px}
@media(max-width:430px){.login-card{padding:23px 21px}.logo{font-size:25px}.logo svg{width:44px;height:44px}}
</style>
</head>
<body>
<main id="login-screen">
<form class="login-card" id="login-form" autocomplete="off">
<div class="logo">
<svg aria-hidden="true" viewBox="0 0 60 60" fill="none"><path d="M30 55V30M30 40C12 37 8 18 14 13c14-2 17 9 16 27ZM30 35C48 30 52 18 48 11c-14-1-21 9-18 24Z" stroke="#98764c" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><g fill="#8ac39b"><ellipse cx="17" cy="18" rx="8" ry="5" transform="rotate(28 17 18)"/><ellipse cx="39" cy="18" rx="8" ry="5" transform="rotate(-28 39 18)"/><ellipse cx="28" cy="8" rx="6" ry="4"/></g><path d="M18 56h25" stroke="#c8b890" stroke-width="3" stroke-linecap="round"/></svg>
<span>مشجر</span>
</div>
<p class="subtitle">الشيخ محمد السياري ـ رحمه الله</p>
<label for="username">اسم المستخدم</label>
<input id="username" name="username" type="text" placeholder="USER1 أو USER2" inputmode="text" autocapitalize="characters" autocomplete="username" spellcheck="false" required>
<label for="password">كلمة المرور</label>
<input id="password" name="password" type="password" placeholder="أدخل كلمة المرور" autocomplete="current-password" required>
<button id="enter" type="submit">دخول</button>
<p id="error" role="alert" aria-live="polite"></p><p id="unsupported"></p>
</form>
</main>
<section id="site-screen" aria-label="شجرة العائلة"><iframe id="site-frame" title="موقع مشجر" referrerpolicy="no-referrer"></iframe><button id="logout" type="button">تسجيل الخروج</button></section>

const $=id=>document.getElementById(id);
function bytes(s){const binary=atob(s);return Uint8Array.from(binary,c=>c.charCodeAt(0))}
let busy=false;
$('login-form').addEventListener('submit',async event=>{
    event.preventDefault();if(busy)return;
    $('error').textContent='';
    const name=$('username').value.trim().toUpperCase();
    const pass=$('password').value;
    const pack=dataTable[name];
    if(!pack){$('error').textContent='اسم المستخدم أو كلمة المرور غير صحيحة';return}
    if(!globalThis.crypto?.subtle){$('error').textContent='المتصفح لا يدعم فتح هذه النسخة. افتح الملف في متصفح حديث.';return}
    busy=true;$('enter').disabled=true;$('enter').textContent='جارٍ التحقق...';
    try{
       const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
       const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(pack.salt),iterations:310000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
       const decrypted=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(pack.nonce),additionalData:new TextEncoder().encode('treesayari:'+name)},key,bytes(pack.body));
       const html=new TextDecoder().decode(decrypted);
       $('site-frame').srcdoc=html;
       $('login-screen').hidden=true;
       $('login-screen').style.display='none';
       $('site-screen').style.display='block';
       $('password').value='';
    }catch(_){$('error').textContent='اسم المستخدم أو كلمة المرور غير صحيحة';$('password').value='';$('password').focus()}
    finally{busy=false;$('enter').disabled=false;$('enter').textContent='دخول'}
});
$('logout').addEventListener('click',()=>{
  $('site-frame').srcdoc='';$('site-frame').removeAttribute('srcdoc');$('site-screen').style.display='none';
  $('login-screen').style.display='flex';$('username').value='';$('password').value='';$('error').textContent='';$('username').focus();
});
</script>
